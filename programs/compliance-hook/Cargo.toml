[package]
name = "compliance-hook"
version = "0.1.0"
description = "Token-2022 transfer hook for KYC enforcement"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "compliance_hook"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022", "token_2022_extensions"] }
spl-transfer-hook-interface = "0.10.0"
spl-tlv-account-resolution = "0.10.0"
spl-token-2022 = { version = "8", features = ["no-entrypoint"] }
